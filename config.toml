# ============================================================
#  Jarvis Voz — configuração
#  Edite e reinicie o Jarvis para aplicar.
# ============================================================

[audio]
input_device_match = "Brio"     # trecho do nome do mic; "" = padrão do Windows

# --- detecção de fala (VAD) ---
speech_level = 0.018            # energia mínima pra considerar que você falou
silence_timeout = 0.9          # silêncio (s) que encerra uma fala
max_utterance_seconds = 9.0
pre_roll_seconds = 0.6         # segundos de áudio antes do disparo (não cortar sílaba)

# --- palmas (atalho opcional) ---
clap_enabled = true
clap_instant_activate = true   # 2 palmas = rotina de chegada na hora
clap_sensitivity = 7.0
clap_min_level = 0.030
clap_window_seconds = 1.6
clap_min_gap_seconds = 0.12
claps_required = 2

[arrival]
# Frase que dispara a ROTINA DE CHEGADA (saudação + Steam + Spotify).
phrase = "bom dia neném o papai chegou"
match_threshold = 0.72         # quão parecida a fala precisa ser (sobe = mais rígido)
reactivate_cooldown_seconds = 30
sequence = [
  "app:steam",
  "spotify:track:2YH7ZVyUfX6qMqDOV9lw9B",   # AC/DC - Highway to Hell
]
spotify_force_play = true
spotify_wait_seconds = 4.0
greeting = "Bom dia, senhor. Com o que posso te ajudar?"

[wake]
# Reconhecimento de voz (Whisper local). NÃO é a frase de chegada.
whisper_model = "small"        # tiny | base | small | medium
whisper_language = "pt"
whisper_device = "cpu"         # "cuda" usa a GTX 1650 (precisa libs CUDA extras)
whisper_initial_prompt = "Bom dia, neném, o papai chegou. Jarvis, abrir Steam. Jarvis, jogar Palworld. Jarvis, desligar o computador."

[assistant]
address = "Senhor"
user_name = "Arthur"
wake_word = "jarvis"           # precisa vir no INÍCIO da fala pra ele agir
attention_reply = "Olá senhor, com o que posso ajudar?"
ollama_url = "http://localhost:11434"
model = "qwen3.5:2b"
reply_num_predict = 160
compose_num_predict = 600      # tamanho máx. de textos que ele redige
system_prompt = """
Você é o Jarvis, mordomo e assistente pessoal do Arthur.
Regras invioláveis:
- Dirija-se a ele SEMPRE como "Senhor". Nunca use o primeiro nome dele para chamá-lo.
- Se ele perguntar qual é o nome dele, responda que o nome dele é Arthur, mas continue tratando-o por "Senhor".
- Responda em português do Brasil.
- Suas respostas são faladas em voz alta: no máximo 2 frases curtas, sem listas, sem markdown, sem emojis.
- Tom cordial, respeitoso e levemente formal, como um mordomo britânico.
"""

[tts]
sapi_voice = "Microsoft Maria Desktop"
sapi_rate = 0
ready_line = ""

[app]
# O "cérebro" holográfico (E:\OpenJarvis\jarvis-app). Independente: abre e
# fecha por conta própria; o Jarvis funciona com ou sem ele.
enabled = true
exe_path = "E:\\OpenJarvis\\jarvis-app\\dist\\JarvisApp.exe"
open_on_arrival = true       # abre por último na rotina de chegada
open_on_wake_word = true     # abre ao dizer só "jarvis"

[danger]
# Ações sensíveis. Todas pedem confirmação falada ("sim"/"confirma"/"pode").
# Deixe 'false' para bloquear de vez.
allow_shutdown = true
allow_restart = true
allow_suspend = true
allow_close = true            # "jarvis, fecha isso" (Alt+F4) / "fecha o <app>"
allow_typing = true           # "jarvis, digitar ..." e "jarvis, escrever um texto sobre ..."
shutdown_delay_seconds = 45   # tempo até desligar (dá pra abortar com "jarvis, cancelar")

[apps]
steam       = "run:C:\\Program Files (x86)\\Steam\\steam.exe"
spotify     = "run:spotify:"
youtube     = "url:https://www.youtube.com"
google      = "url:https://www.google.com"
gmail       = "url:https://mail.google.com"
whatsapp    = "url:https://web.whatsapp.com"
navegador   = "url:https://www.google.com"
calculadora = "run:calc:"
"bloco de notas" = "run:notepad"
notepad     = "run:notepad"
explorador  = "run:explorer"
configuracoes = "run:ms-settings:"
