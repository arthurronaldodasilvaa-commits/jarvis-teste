<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>JARVIS</title>
<style>
  :root { --neon: #46d6ff; --neon-dim: #1f6f92; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  body { font-family: "Segoe UI", Consolas, monospace; color: var(--neon); cursor: default; }

  #scene { position: fixed; inset: 0; z-index: 1; }

  /* vinheta + scanlines pra dar cara de holograma */
  #fx {
    position: fixed; inset: 0; z-index: 2; pointer-events: none;
    background:
      radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.75) 100%),
      repeating-linear-gradient(0deg, rgba(70,214,255,0.035) 0 1px, transparent 1px 3px);
    mix-blend-mode: screen;
  }

  .hud {
    position: fixed; z-index: 3; pointer-events: none;
    font-size: 12px; letter-spacing: 3px; text-transform: uppercase;
    text-shadow: 0 0 8px var(--neon);
    opacity: 0.75;
  }
  #brand  { top: 22px; left: 26px; font-size: 15px; letter-spacing: 6px; }
  #status { bottom: 22px; left: 26px; }
  #hint   { bottom: 22px; right: 26px; opacity: 0.35; letter-spacing: 2px; }

  /* barra de botões embaixo */
  #controls {
    position: fixed; z-index: 4; left: 50%; bottom: 26px; transform: translateX(-50%);
    display: flex; gap: 12px;
  }
  #controls > div {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 18px 9px 14px; cursor: pointer; user-select: none;
    border: 1px solid var(--neon-dim); border-radius: 999px;
    background: rgba(70,214,255,0.06);
    color: var(--neon); font-size: 12px; letter-spacing: 3px; text-transform: uppercase;
    text-shadow: 0 0 8px var(--neon);
    transition: border-color .2s, background .2s, color .2s;
  }
  #controls > div:hover { background: rgba(70,214,255,0.14); }
  #power .dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--neon); box-shadow: 0 0 12px var(--neon);
  }
  #cam-btn .ico {
    width: 11px; height: 8px; border: 1.5px solid var(--neon); border-radius: 2px;
    box-shadow: 0 0 8px var(--neon);
  }
  body.paused { --neon: #ffb24d; --neon-dim: #7a5320; }
  body.paused #controls > div { background: rgba(255,178,77,0.10); }
  body.paused #power .dot { animation: none; box-shadow: 0 0 12px #ffb24d; }
  body.paused #status::before { background: #ffb24d; box-shadow: 0 0 10px #ffb24d; animation: none; }
  #fx.paused {
    background:
      radial-gradient(ellipse at center, rgba(255,150,40,0.05) 0%, transparent 45%, rgba(0,0,0,0.82) 100%),
      repeating-linear-gradient(0deg, rgba(255,178,77,0.03) 0 1px, transparent 1px 3px);
  }

  #status::before {
    content: ""; display: inline-block; width: 7px; height: 7px; margin-right: 9px;
    border-radius: 50%; background: var(--neon); box-shadow: 0 0 10px var(--neon);
    vertical-align: middle; animation: blink 2.4s ease-in-out infinite;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.25} }

  #close {
    position: fixed; top: 16px; right: 20px; z-index: 4;
    width: 26px; height: 26px; line-height: 24px; text-align: center;
    border: 1px solid var(--neon-dim); border-radius: 50%;
    color: var(--neon); font-size: 14px; opacity: 0.3; cursor: pointer;
    transition: opacity .2s;
  }
  #close:hover { opacity: 1; }

  /* ---------- visão da câmera ---------- */
  #cam {
    position: fixed; inset: 0; z-index: 1; width: 100%; height: 100%;
    object-fit: cover; transform: scaleX(-1);           /* espelhado (selfie) */
    filter: brightness(0.72) contrast(1.12) saturate(1.25);
  }
  #cam-fx {
    position: fixed; inset: 0; z-index: 2; pointer-events: none;
    transform: scaleX(-1);
  }
  #cam-tint {
    position: fixed; inset: 0; z-index: 2; pointer-events: none;
    background: radial-gradient(ellipse at center, rgba(40,150,190,0.10), rgba(0,20,30,0.55) 100%);
    mix-blend-mode: screen;
  }
  .cam-bracket {
    position: fixed; z-index: 3; width: 46px; height: 46px; pointer-events: none;
    border: 2px solid var(--neon); opacity: 0.8; filter: drop-shadow(0 0 6px var(--neon));
  }
  .cam-bracket.tl { top: 26px; left: 26px; border-right: 0; border-bottom: 0; }
  .cam-bracket.tr { top: 26px; right: 26px; border-left: 0; border-bottom: 0; }
  .cam-bracket.bl { bottom: 26px; left: 26px; border-right: 0; border-top: 0; }
  .cam-bracket.br { bottom: 26px; right: 26px; border-left: 0; border-top: 0; }
  #cam-label {
    position: fixed; z-index: 3; top: 26px; left: 50%; transform: translateX(-50%);
    font-size: 12px; letter-spacing: 4px; text-transform: uppercase;
    text-shadow: 0 0 8px var(--neon); pointer-events: none;
  }
  #cam-motion-wrap {
    position: fixed; z-index: 3; bottom: 74px; left: 50%; transform: translateX(-50%);
    width: 220px; height: 3px; background: rgba(70,214,255,0.15); pointer-events: none;
  }
  #cam-motion {
    height: 100%; width: 100%; transform-origin: left center; transform: scaleX(0);
    background: var(--neon); box-shadow: 0 0 10px var(--neon);
    transition: transform .12s linear;
  }

  /* alterna entre cérebro e câmera */
  body:not(.camera) #cam,
  body:not(.camera) #cam-fx,
  body:not(.camera) #cam-tint,
  body:not(.camera) .cam-bracket,
  body:not(.camera) #cam-label,
  body:not(.camera) #cam-motion-wrap { display: none; }
  body.camera #scene, body.camera #fx, body.camera #brand, body.camera #hint { display: none; }
</style>
</head>
<body>
  <div id="scene"></div>
  <div id="fx"></div>

  <video id="cam" autoplay muted playsinline></video>
  <canvas id="cam-fx"></canvas>
  <div id="cam-tint"></div>
  <div class="cam-bracket tl"></div><div class="cam-bracket tr"></div>
  <div class="cam-bracket bl"></div><div class="cam-bracket br"></div>
  <div id="cam-label">Câmera</div>
  <div id="cam-motion-wrap"><div id="cam-motion"></div></div>

  <div id="brand" class="hud">J.A.R.V.I.S</div>
  <div id="status" class="hud">Iniciando</div>
  <div id="hint" class="hud">ctrl+alt+j &nbsp;·&nbsp; esc: fechar</div>
  <div id="controls">
    <div id="power" title="Ligar / pausar a escuta do Jarvis">
      <span class="dot"></span><span id="power-label">Ouvindo</span>
    </div>
    <div id="cam-btn" title="Alternar câmera / cérebro">
      <span class="ico"></span><span id="cam-btn-label">Câmera</span>
    </div>
  </div>
  <div id="close" title="Fechar">&times;</div>

  <script src="lib/three.min.js"></script>
  <script src="lib/mp_hands/hands.js"></script>
  <script src="handtrack.js"></script>
  <script src="camera.js"></script>
  <script src="hologram.js"></script>
</body>
</html>
