<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#05080c" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<title>Jarvis — controle</title>
<style>
  :root{
    --void:#05080c; --panel:#0b131c; --ink:#d3e9f3; --dim:#7fa0b0;
    --neon:#46d6ff; --neon-deep:#1f6f92; --glow:rgba(70,214,255,.28);
    --think:#9a8cff; --search:#35f5ad; --err:#ff6a6a;
    --font:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
    --mono:"Cascadia Mono",ui-monospace,"SF Mono",Consolas,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:var(--void);color:var(--ink);font-family:var(--font);
    -webkit-tap-highlight-color:transparent;overscroll-behavior:none}
  body{display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    background:radial-gradient(ellipse at 50% 30%, #0a1622 0%, var(--void) 70%)}

  header{display:flex;align-items:center;gap:10px;padding:16px 18px 8px}
  header .mk{font-family:var(--mono);letter-spacing:.32em;font-size:14px;color:var(--ink)}
  header .st{margin-left:auto;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);
    display:flex;align-items:center;gap:7px}
  header .st i{width:7px;height:7px;border-radius:50%;background:var(--neon);box-shadow:0 0 8px var(--neon)}
  header .st.off i{background:var(--err);box-shadow:0 0 8px var(--err)}

  #hudline{padding:2px 18px 0;font-family:var(--mono);font-size:11px;color:var(--dim);min-height:16px;letter-spacing:.04em}

  main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:10px 22px}

  /* botão falar */
  #ptt{
    position:relative;width:min(62vw,240px);height:min(62vw,240px);border-radius:50%;
    border:1px solid var(--neon-deep);background:
      radial-gradient(circle at 50% 42%, rgba(70,214,255,.16), rgba(70,214,255,.03) 60%, transparent 72%);
    color:var(--neon);font-family:var(--mono);font-size:15px;letter-spacing:.18em;text-transform:uppercase;
    display:flex;align-items:center;justify-content:center;text-align:center;
    box-shadow:0 0 40px var(--glow), inset 0 0 40px rgba(70,214,255,.06);
    transition:transform .12s ease, box-shadow .2s, border-color .2s;user-select:none;touch-action:none;
  }
  #ptt .ring{position:absolute;inset:-2px;border-radius:50%;border:2px solid var(--neon);opacity:.25}
  #ptt .ring.b{inset:-16px;opacity:.12}
  #ptt.rec{transform:scale(.96);border-color:var(--neon);color:var(--ink);
    box-shadow:0 0 70px var(--glow), inset 0 0 60px rgba(70,214,255,.12)}
  #ptt.rec .ring{animation:pulse 1.1s ease-in-out infinite}
  #ptt.busy{border-color:var(--think);color:var(--think);box-shadow:0 0 50px rgba(154,140,255,.3)}
  @keyframes pulse{0%,100%{transform:scale(1);opacity:.25}50%{transform:scale(1.06);opacity:.5}}

  #hint{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);text-align:center}

  /* conversa */
  #convo{width:100%;max-width:520px;display:flex;flex-direction:column;gap:10px;min-height:96px;
    max-height:34vh;overflow-y:auto;padding:0 2px}
  .msg{padding:10px 14px;border-radius:12px;font-size:15px;line-height:1.5;max-width:88%}
  .msg.you{align-self:flex-end;background:rgba(70,214,255,.10);border:1px solid var(--neon-deep);color:var(--ink)}
  .msg.jrv{align-self:flex-start;background:var(--panel);border:1px solid rgba(70,214,255,.14);color:var(--dim)}
  .msg.jrv b{color:var(--ink);font-weight:600}
  .msg .who{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase;opacity:.5;margin-bottom:3px}

  footer{padding:8px 18px 14px;display:flex;gap:10px;align-items:center}
  footer input{flex:1;background:var(--panel);border:1px solid var(--neon-deep);border-radius:999px;
    color:var(--ink);font:inherit;font-size:15px;padding:11px 16px;outline:none}
  footer input::placeholder{color:var(--dim)}
  footer button{background:transparent;border:1px solid var(--neon-deep);color:var(--neon);border-radius:999px;
    padding:11px 16px;font:inherit;font-size:14px}

  .toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);
    background:var(--panel);border:1px solid var(--err);color:#ffd9d9;font-size:13px;padding:10px 16px;border-radius:10px;
    max-width:86vw;text-align:center;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.on{opacity:1}
</style>
</head>
<body>
  <header>
    <span class="mk">JARVIS</span>
    <span class="st off" id="st"><i></i><span id="ststr">conectando</span></span>
  </header>
  <div id="hudline"></div>

  <main>
    <button id="ptt" aria-label="Segure para falar">
      <span class="ring"></span><span class="ring b"></span>
      <span id="pttlabel">Segure<br>para falar</span>
    </button>
    <div id="hint">solte pra enviar</div>
    <div id="convo"></div>
  </main>

  <footer>
    <input id="txt" type="text" placeholder="ou digite um comando…" autocomplete="off" enterkeyhint="send" />
    <button id="send">Enviar</button>
  </footer>

  <div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";
  var KEY = new URLSearchParams(location.search).get("k") || "";
  var $ = function(id){ return document.getElementById(id); };
  var ptt = $("ptt"), convo = $("convo"), toastEl = $("toast");
  var rec = null, chunks = [], stream = null, recording = false, busy = false;
  var player = new Audio();

  function toast(m){ toastEl.textContent = m; toastEl.classList.add("on");
    clearTimeout(toast._t); toast._t = setTimeout(function(){ toastEl.classList.remove("on"); }, 3200); }

  function add(kind, text){
    var d = document.createElement("div");
    d.className = "msg " + (kind === "you" ? "you" : "jrv");
    d.innerHTML = '<span class="who">' + (kind === "you" ? "você" : "jarvis") + '</span>' +
      String(text).replace(/[<>&]/g, function(c){ return {"<":"&lt;",">":"&gt;","&":"&amp;"}[c]; });
    convo.appendChild(d); convo.scrollTop = convo.scrollHeight;
    while (convo.children.length > 30) convo.removeChild(convo.firstChild);
  }

  // ---- estado do PC ----
  var stEl = $("st"), stStr = $("ststr"), hud = $("hudline");
  function poll(){
    fetch("/state?k=" + KEY, { cache:"no-store" }).then(function(r){ return r.json(); }).then(function(s){
      stEl.classList.remove("off");
      var PH = { thinking:"pensando", processing:"processando", searching:"buscando", error:"erro" };
      stStr.textContent = s.speaking ? "falando" : (PH[s.phase] || (s.status || "ouvindo").toLowerCase());
      stEl.style.setProperty("--i", "1");
      var bits = [];
      if (s.weather) bits.push(s.weather);
      if (s.track && s.track.title) bits.push("♪ " + s.track.title + (s.track.artist ? " — " + s.track.artist : ""));
      hud.textContent = bits.join("   ·   ");
    }).catch(function(){ stEl.classList.add("off"); stStr.textContent = "sem conexão"; });
  }
  poll(); setInterval(poll, 2500);

  // ---- gravação ----
  function pickMime(){
    var opts = ["audio/webm;codecs=opus","audio/webm","audio/ogg;codecs=opus","audio/mp4"];
    for (var i=0;i<opts.length;i++) if (window.MediaRecorder && MediaRecorder.isTypeSupported(opts[i])) return opts[i];
    return "";
  }

  function startRec(){
    if (recording || busy) return;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      toast("Este navegador não deixa usar o microfone aqui. Abra pelo Chrome, em HTTPS."); return;
    }
    recording = true; ptt.classList.add("rec"); $("pttlabel").innerHTML = "Ouvindo…";
    navigator.mediaDevices.getUserMedia({ audio:{ echoCancellation:true, noiseSuppression:true } }).then(function(s){
      stream = s;
      var mt = pickMime();
      rec = new MediaRecorder(s, mt ? { mimeType:mt } : undefined);
      chunks = [];
      rec.ondataavailable = function(e){ if (e.data && e.data.size) chunks.push(e.data); };
      rec.onstop = function(){
        (stream.getTracks() || []).forEach(function(t){ t.stop(); });
        var blob = new Blob(chunks, { type: rec.mimeType || "audio/webm" });
        if (blob.size < 900){ resetPtt(); return; }
        send(blob);
      };
      rec.start();
      if (!recording){ try{ rec.stop(); }catch(e){} }   // soltou antes de abrir o mic
    }).catch(function(err){
      recording = false; resetPtt();
      toast("Sem acesso ao microfone: " + (err && err.name || err));
    });
  }
  function stopRec(){
    if (!recording) return;
    recording = false;
    if (rec && rec.state === "recording"){ try{ rec.stop(); }catch(e){} }
    else resetPtt();
  }
  function resetPtt(){ ptt.classList.remove("rec"); busy || ($("pttlabel").innerHTML = "Segure<br>para falar"); }

  function setBusy(b){
    busy = b; ptt.classList.toggle("busy", b);
    $("pttlabel").innerHTML = b ? "…" : "Segure<br>para falar";
  }

  function send(blob){
    setBusy(true); ptt.classList.remove("rec");
    fetch("/listen?k=" + KEY, { method:"POST", body:blob, headers:{ "Content-Type": blob.type || "application/octet-stream" } })
      .then(function(r){ return r.json(); })
      .then(handle).catch(function(){ toast("Falha ao enviar. Rede?"); }).finally(function(){ setBusy(false); });
  }
  function sendText(t){
    if (!t.trim()) return;
    add("you", t); setBusy(true);
    fetch("/say?k=" + KEY, { method:"POST", body: JSON.stringify({ text:t }), headers:{ "Content-Type":"application/json" } })
      .then(function(r){ return r.json(); }).then(function(d){ handle(d, true); })
      .catch(function(){ toast("Falha ao enviar."); }).finally(function(){ setBusy(false); });
  }
  function handle(d, skipYou){
    if (!d) return;
    if (!skipYou && d.heard) add("you", d.heard);
    if (d.reply) add("jrv", d.reply);
    if (d.audio){ player.src = d.audio; player.play().catch(function(){}); }
  }

  // eventos do botão (pointer cobre toque e mouse)
  ptt.addEventListener("pointerdown", function(e){ e.preventDefault(); startRec(); });
  ptt.addEventListener("pointerup", function(e){ e.preventDefault(); stopRec(); });
  ptt.addEventListener("pointercancel", stopRec);
  ptt.addEventListener("pointerleave", function(){ if (recording) stopRec(); });
  window.addEventListener("blur", function(){ if (recording) stopRec(); });

  $("send").addEventListener("click", function(){ var v = $("txt").value; $("txt").value = ""; sendText(v); });
  $("txt").addEventListener("keydown", function(e){ if (e.key === "Enter"){ var v = this.value; this.value = ""; sendText(v); } });

  if (!KEY){ toast("Link sem chave — abra pelo QR code do Jarvis."); }
})();
</script>
</body>
</html>
