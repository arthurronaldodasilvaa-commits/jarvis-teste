# skills_extra.toml — comandos personalizados do Jarvis (sem programar)
#
# Cada [[skill]] tem:
#   patterns  (obrigatório) lista de regex — casadas no texto SEM acento e minúsculo
#   speak     frase que o Jarvis fala
#   open      arquivo / pasta / link http(s):// / nome de app pra abrir
#   run       comando no shell (roda escondido)
#   then      outro comando pro Jarvis executar (ex: "modo cinema")
#   confirm   true = pede "sim" antes de agir
#
# Detalhes: veja o topo de voice/skills_extra.py
# É recarregado sozinho quando você salva o arquivo.

# --- exemplos (descomente e ajuste) ---------------------------------------

