# ============================================================
#  Jarvis Voz — configuração
#  Edite e reinicie o Jarvis para aplicar.
# ============================================================

[profile]
# Quem está usando. Muda só COMO o Jarvis chama e trata a pessoa
# (nome, tratamento, persona, voz, frase de chegada) — todas as
# funcionalidades continuam iguais pra qualquer perfil.
# "" = usa só este config.toml. Um perfil é um  profiles/<nome>.toml.
# Também dá pra forçar por  --profile robson  ou env  JARVIS_PROFILE.
active = "arthur"

[audio]
input_device_match = "Brio"     # trecho do nome do mic; "" = padrão do Windows

# --- detecção de fala (VAD) ---
speech_level = 0.018            # energia mínima pra considerar que você falou
silence_timeout = 1.1          # silêncio (s) que encerra uma fala (maior = corta menos)
max_utterance_seconds = 7.0
pre_roll_seconds = 0.6         # segundos de áudio antes do disparo (não cortar sílaba)
min_utterance_seconds = 0.35   # ignora "falas" mais curtas que isso (clique, tosse)

[arrival]
# Frase de chegada. Ao reconhecer, na ORDEM:
#   1) toca a música   2) diz a saudação   3) traz o app pra frente
enabled = true
briefing = true              # após a saudação, fala hora + clima + lembretes do dia
phrase = "acorda criança o papai chegou"
match_threshold = 0.74
reactivate_cooldown_seconds = 20
greeting = "Bem-vindo, senhor!"
greeting_delay = 1.2          # segundos entre a música começar e a saudação
spotify = "spotify:track:39shmbIHICJ2Wxnk1fPSdz"   # Should I Stay or Should I Go — The Clash (Combat Rock)
spotify_search = "Should I Stay or Should I Go The Clash"   # usado se o link acima falhar

[spotify]
# As chaves (client_id / client_secret) ficam em  voice/secrets.toml  (fora do git).
# Crie um app em https://developer.spotify.com/dashboard e cole lá.
client_id = ""
client_secret = ""
market = "BR"
# Abrir spotify:track: já toca sozinho. Só ligue force_play se a faixa CARREGAR
# mas não começar — aí ele manda um "play" depois de wait_seconds.
force_play = false
wait_seconds = 2.5
announce = false        # false = toca calado; true = fala "Tocando X, senhor"

[wake]
# Reconhecimento de voz em 2 estágios (economiza MUITA CPU quando você não
# está falando com o Jarvis):
#   1) TODA fala passa por um modelo minúsculo e rápido ('wake_model')
#   2) só se detectar "jarvis"/frase de chegada, re-transcreve com o bom ('command_model')
wake_model = "tiny"           # tiny | base   (1ª passada, tem que ser rápida)
command_model = "small"       # base | small | medium   (2ª passada, precisão)
beam_size = 1                 # 1 = ganancioso/rápido; 5 = mais preciso/lento
whisper_language = "pt"
whisper_device = "cpu"        # "cuda" usa a GTX 1650 (precisa libs CUDA extras)
whisper_initial_prompt = "Assistente de voz em português. A pessoa chama o assistente de Jarvis. Acorda, criança, o papai chegou. Ela estuda trigonometria: triângulo retângulo, tabela de ângulos notáveis, relações trigonométricas, seno, cosseno, tangente, hipotenusa, cateto."

[assistant]
address = "Senhor"
user_name = "Arthur"
wake_word = "jarvis"           # precisa vir no INÍCIO da fala pra ele agir
attention_reply = "Olá senhor, com o que posso ajudar?"
provider = "ollama"           # ollama | openai | anthropic  (ver voice/llm.py)
ollama_url = "http://localhost:11434"
model = "qwen3.5:2b"
reply_num_predict = 110        # respostas faladas: curtas
compose_num_predict = 600      # tamanho máx. de textos que ele redige
keepwarm_minutes = 10          # ping no Ollama a cada N min p/ o modelo não descarregar (0 = desliga)
keep_alive = "1h"             # quanto tempo o Ollama segura o modelo na RAM após cada uso

# --- trocar de backend (opcional) -----------------------------------------
# fallback_provider = "openai"        # se o principal falhar/timeout, tenta este
# openai_url   = "http://localhost:1234/v1"   # LM Studio / llama.cpp / vLLM / OpenRouter
# openai_model = "qwen2.5-7b-instruct"
# openai_api_key = ""                  # (melhor pôr em secrets.toml)
# anthropic_model = "claude-3-5-haiku-latest"
# anthropic_api_key = ""               # (melhor pôr em secrets.toml)
system_prompt = """
Você é o Jarvis, assistente pessoal por voz. Fala com uma única pessoa, a quem chama sempre de "Senhor".
- Responda em português do Brasil, curto: 1 ou 2 frases. É voz — nada de listas, markdown ou emojis.
- Fale DIRETAMENTE com ele ("o senhor..."), nunca na terceira pessoa e nunca use o nome dele para se dirigir a ele.
- O nome dele é Arthur. Só diga isso se ele perguntar o próprio nome; fora disso, "Senhor".
- Tom cordial e discreto, estilo mordomo. Se não souber, diga que não sabe — não invente.
"""
# Base de conhecimento do perfil (empresa, contexto pessoal…). É anexada ao
# system_prompt. Útil por perfil — cada cliente descreve aqui o próprio negócio.
knowledge = """
O senhor é Arthur, sócio do Instituto CAM (empresa da família, do seu pai Robson Leandro).
Ser sócio do instituto não é a sua profissão — o senhor ainda não tem uma profissão definida.
O que o senhor quer ser: lutador e inventor.
O Instituto CAM ("Corpo Ativa Mente") faz desenvolvimento humano e corporativo;
o método é a tríade Consciência, Ação, Mudança.
"""

[tts]
engine = "piper"                       # "piper" (voz neural local, melhor) ou "sapi" (voz do Windows)
piper_path = ""                        # vazio = voice/piper/piper/piper.exe
piper_voice = ""                       # vazio = voice/piper/voices/pt_BR-faber-medium.onnx
sapi_voice = "Microsoft Maria Desktop" # usado se engine="sapi" ou o Piper não estiver presente
sapi_rate = 0
ready_line = ""

[location]
# Cidade padrão pro clima ("Jarvis, como está o tempo?"). Vazio = detecta pelo IP.
city = "Blumenau"

[perf]
log_max_kb = 512              # ao iniciar, corta o jarvis_voice.log se passar disso

[app]
# O "cérebro" holográfico (E:\OpenJarvis\jarvis-app). Independente: abre e
# fecha por conta própria; o Jarvis funciona com ou sem ele.
enabled = true
exe_path = "E:\\OpenJarvis\\jarvis-app\\dist\\JarvisApp.exe"
open_on_arrival = true       # abre por último na rotina de chegada
open_on_wake_word = true     # abre ao dizer só "jarvis"
camera_match = "Brio"        # trecho do nome da webcam usada no "ativar câmera"

[camera]
hand_skeleton = true         # desenha o esqueleto neon da mão sobre a câmera
media_gestures = true        # na câmera (sem hologramas): mão aberta varre = próxima/anterior,
                             #   punho ~1s = play/pause, palma subindo/descendo = volume
auto_return_seconds = 0      # 0 = nunca; >0 = volta pro cérebro se ninguém aparece por N s

[danger]
# Ações sensíveis. Todas pedem confirmação falada ("sim"/"confirma"/"pode").
# Deixe 'false' para bloquear de vez.
allow_shutdown = false
allow_restart = true
allow_suspend = true
allow_close = true            # "jarvis, fecha isso" (Alt+F4) / "fecha o <app>"
allow_typing = true           # "jarvis, digitar ..." e "jarvis, escrever um texto sobre ..."
shutdown_delay_seconds = 45   # tempo até desligar (dá pra abortar com "jarvis, cancelar")

[apps]
steam       = "run:C:\\Program Files (x86)\\Steam\\steam.exe"
spotify     = "run:spotify:"
youtube     = "url:https://www.youtube.com"
google      = "url:https://www.google.com"
gmail       = "url:https://mail.google.com"
whatsapp    = "url:https://web.whatsapp.com"
navegador   = "url:https://www.google.com"
calculadora = "run:calc:"
"bloco de notas" = "run:notepad"
notepad     = "run:notepad"
explorador  = "run:explorer"
configuracoes = "run:ms-settings:"
